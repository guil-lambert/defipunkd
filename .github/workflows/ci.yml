name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: make build

      - name: Test
        run: make test

  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify README
        run: make verify-readme

      - name: Verify Exit Docs
        run: make check-exit-docs

  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Audit Directory
        run: make audits
